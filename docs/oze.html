<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#f5f5f7"/><meta name="color-scheme" content="light"/>
<title>Gdzie budować OZE</title>
<link rel="icon" href="icons/icon-192.png"/>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#0a66c2;--good:#2e7d32;--mid:#f9a825;--bad:#d32f2f;--chip:#f0f1f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1280px;margin:0 auto}
header h1{margin:0 0 4px;font-size:24px}
header p{margin:0;color:var(--muted)}
header a{color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lead{margin:0 0 6px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin-top:10px}
.weights label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.weights input{grid-column:1/3;width:100%;accent-color:var(--ink)}
.weights small{color:var(--muted);grid-column:1/3}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--chip)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.main:hover td{background:#fafafa;cursor:pointer}
.score{display:flex;align-items:center;gap:8px;min-width:120px}
.score b{width:28px;text-align:right}
.bar{flex:1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.mini{display:flex;gap:3px}
.mini span{width:18px;height:18px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
.chip.warn{background:#fdecea;color:#b71c1c}
.chip.ok{background:#e8f5e9;color:#1b5e20}
tr.det td{background:#fbfbfd}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px}
.det-grid div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.tablewrap{overflow-x:auto}
.count{margin:8px 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.stats .panel h3{margin:0 0 8px;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
@media (max-width:760px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.main{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 8px;position:relative}
  tr.main td{border:0;padding:3px 0}
  tr.main td.hide-m{display:none}
  tr.main td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px;margin-right:6px}
  tr.det{display:block;margin:-6px 0 8px}
  tr.det td{border-radius:0 0 12px 12px}
  .score{min-width:0}
}
</style>
</head>
<body>
<header>
  <h1>Gdzie budować OZE</h1>
  <p>Ocena wszystkich gmin pod elektrownie wiatrowe, słoneczne, biogazownie i spółdzielnie energetyczne. Zmień wagi, aby dopasować ranking do swoich założeń. <a href="./">Wróć do mapy</a></p>
</header>
<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="panel" id="intro"></section>
  <section class="panel" id="ctrl">
    <div class="controls">
      <label class="f">Szukaj gminy<input type="search" id="q" placeholder="nazwa lub TERYT"/></label>
      <label class="f">Województwo<select id="woj"><option value="">cała Polska</option></select></label>
      <label class="f">Rodzaj gminy<select id="typ"><option value="">wszystkie</option><option>wiejska</option><option>miejsko-wiejska</option><option>miejska</option></select></label>
      <label class="f">Pokaż<select id="lim"><option value="100">pierwsze 100</option><option value="300">pierwsze 300</option><option value="5000">wszystkie</option></select></label>
    </div>
    <div class="weights" id="weights"></div>
    <div class="row-actions"><button class="btn" id="reset" type="button">Przywróć domyślne wagi</button><button class="btn" id="csv" type="button">Pobierz CSV</button></div>
  </section>
  <section class="panel" id="list"><p class="count" id="count">Wczytuję dane…</p><div class="tablewrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></section>
  <section id="analysis" hidden></section>
  <section class="panel note" id="method"></section>
</main>
<script src="oze.js"></script>
</body>
</html>
