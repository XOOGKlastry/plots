<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)"/>
<title>Działki EGiB · grupy rejestrowe</title>
<link rel="preconnect" href="https://fonts.bunny.net"/>
<link href="https://fonts.bunny.net/css?family=manrope:400,500,600,700|jetbrains-mono:400,500&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<form id="search" role="search" autocomplete="off">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" enterkeyhint="search" placeholder="Adres lub ID działki" aria-label="Szukaj adresu lub ID działki"/>
  <button type="button" id="qClear" class="icbtn" aria-label="Wyczyść" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <ul id="sugg" role="listbox" hidden></ul>
</form>

<aside id="panel" aria-label="Panel">
  <div id="handle" aria-hidden="true"><span></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="info" aria-selected="true">Działka</button>
    <button role="tab" data-tab="layers">Warstwy</button>
    <button role="tab" data-tab="legend">Legenda</button>
  </nav>
  <div class="tabbody">
    <section data-pane="info" class="pane on">
      <div id="card" class="empty">
        <div class="emptymsg">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 8h14v14H8zM26 8h14v14H26zM8 26h14v14H8zM26 26h14v14H26z"/></svg>
          <p>Przybliż mapę i stuknij działkę albo punkt adresowy.</p>
          <p class="muted">Kolor działki = grupa rejestrowa (EGiB §14).</p>
        </div>
      </div>
    </section>
    <section data-pane="layers" class="pane">
      <h4>Podkład</h4>
      <div id="basemaps" class="bmgrid"></div>
      <h4>Nakładki</h4>
      <label class="sw"><input type="checkbox" id="lyrDz" checked/><span></span>Działki <em>z ≥ 13</em></label>
      <label class="sw"><input type="checkbox" id="lyrAdr" checked/><span></span>Punkty adresowe <em>z ≥ 16</em></label>
      <label class="sw"><input type="checkbox" id="lyrHill"/><span></span>Cieniowanie rzeźby</label>
      <label class="range">Krycie działek <input type="range" id="opac" min="0" max="100" value="45"/></label>
    </section>
    <section data-pane="legend" class="pane"><div id="legend"></div></section>
  </div>
  <footer id="status" class="muted"></footer>
</aside>

<button id="collapse" class="fab" aria-label="Zwiń panel" title="Zwiń panel"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<div class="fabs">
  <button id="locate" class="fab" aria-label="Moja lokalizacja"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
</div>
<button id="layersFab" class="fab mob" aria-label="Warstwy"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg></button>
<nav id="tabbar" aria-label="Nawigacja">
  <button data-tab="info"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Działka</button>
  <button data-tab="layers"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Warstwy</button>
  <button data-tab="legend"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Legenda</button>
  <button data-tab="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Szukaj</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="grupy.js"></script>
<script src="app.js"></script>
</body>
</html>
